# Serves the built React app and passes /api to the backend container.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Uploads are small JSON bodies; 10 MB leaves room
    client_max_body_size 10m;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The browser's Origin is this server (localhost:3000), so the call is same-origin for the user.
        # Passing Origin on would make the backend apply its CORS rule, which allows only the Vite dev
        # server, and refuse the request. The Vite proxy drops it for the same reason.
        proxy_set_header Origin "";

        # PDF and Excel downloads: buffer generous chunks in memory, spill the rest to disk,
        # and give a large report time to build
        proxy_buffer_size 16k;
        proxy_buffers 32 64k;
        proxy_busy_buffers_size 128k;
        proxy_max_temp_file_size 256m;
        proxy_read_timeout 120s;
    }

    # Built assets have content hashes in their names, so they can be cached for long
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Client routes such as /orders/12 or /reports are handled by the React router
    location / {
        try_files $uri $uri/ /index.html;
    }
}

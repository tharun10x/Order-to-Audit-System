spring:
  application:
    name: order-to-audit
  # No default profile on purpose (R2.8): without one there is no JWT secret and no test data,
  # so a deployment that forgets to set a profile fails at startup instead of using public dev values.

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/order_to_audit}
    username: ${DB_USERNAME:ota}
    password: ${DB_PASSWORD:ota}

  jpa:
    hibernate:
      ddl-auto: validate   # Flyway owns the schema; Hibernate only checks it
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

ota:
  security:
    jwt:
      secret: ${JWT_SECRET:}          # required, at least 32 bytes. Only dev and test have a default
      expiry: ${JWT_EXPIRY:8h}
    cors-allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:5173}   # the Vite dev server
  # Business date (F1): unset = today. A date such as 2026-11-28 pins "today" at 10:00 IST, for demos
  clock:
    fixed-date: ${OTA_BUSINESS_DATE:}
